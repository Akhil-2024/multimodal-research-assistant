name: Test multimodal API

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run offline integration tests (mock model weights)
        env:
          OPENAI_API_KEY: ""
        run: python -m pytest -q tests/test_platform.py
