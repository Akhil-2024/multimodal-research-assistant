services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/runtime_data
      - OPENAI_API_KEY
      - OPENAI_MODEL=gpt-4.1-mini
    volumes:
      - ./runtime_data:/app/runtime_data

  ui:
    build: .
    command: ["streamlit", "run", "frontend/multimodal_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
